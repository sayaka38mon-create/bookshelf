<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>読んだ本リスト 2021–2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500&display=swap" rel="stylesheet">
<style>
  button.au{font-weight:500}
  header.hero{background:var(--paper);padding-top:0} header.hero .hero-top{padding:56px 0 40px;margin-bottom:32px;background:#1F4A42;box-shadow:0 0 0 100vmax #1F4A42;clip-path:inset(0 -100vmax)} header.hero .hero-top h1 .en,header.hero .hero-top h1 .ja,header.hero .hero-top .tally b{color:#fff} header.hero .hero-top .kicker,header.hero .hero-top .lead,header.hero .hero-top .tally span{color:rgba(255,255,255,.8)}
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#26332F; --muted:#6F7D78; --line:#DDE5E0;
  --night:#F0F4F1; --night-ink:#1F4A42; --night-muted:#6B857D;
  --accent:#2F6F66; --accent-ink:#FFFFFF; --on-c:#26332F;
  --g-novel:#2E5E5A; --g-words:#5E8E84; --g-work:#94B9AF; --g-life:#C5DAD2; --g-learn:#6F8FAE; --g-manga:#B3C6DB;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161B1A; --card:#1E2523; --ink:#E7EFEC; --muted:#9DAEA8; --line:#2E3936;
    --night:#1C2926; --night-ink:#E4F0EB; --night-muted:#8FB0A6;
    --accent:#86C5B6; --accent-ink:#161B1A; --on-c:#161B1A;
    --g-novel:#6FA59E; --g-words:#8FBCB1; --g-work:#B4D1C8; --g-life:#D3E5DE; --g-learn:#9DB8D2; --g-manga:#C9D7E7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161B1A; --card:#1E2523; --ink:#E7EFEC; --muted:#9DAEA8; --line:#2E3936;
  --night:#1C2926; --night-ink:#E4F0EB; --night-muted:#8FB0A6;
  --accent:#86C5B6; --accent-ink:#161B1A; --on-c:#161B1A;
  --g-novel:#6FA59E; --g-words:#8FBCB1; --g-work:#B4D1C8; --g-life:#D3E5DE; --g-learn:#9DB8D2; --g-manga:#C9D7E7;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ===== hero ===== */
.hero{background:var(--night);color:var(--night-ink);padding:64px 0 0;overflow:hidden}
.hero-top{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end}
.kicker{font-family:var(--num);font-style:italic;font-size:22px;color:var(--night-muted);margin:0}
.hero h1{margin:0;line-height:.9}
.hero h1 .en{display:block;color:var(--accent);font-family:var(--num);font-style:italic;font-weight:600;font-size:clamp(72px,14vw,168px);letter-spacing:-.02em}
.hero h1 .ja{display:block;font-family:var(--mincho);font-weight:700;font-size:clamp(20px,2.6vw,28px);letter-spacing:.18em;margin-top:14px}
.tally{display:grid;gap:10px;text-align:right;padding-bottom:10px}
.tally div{display:flex;align-items:baseline;justify-content:flex-end;gap:8px}
.tally b{font-family:var(--num);font-style:italic;font-weight:600;font-size:46px;line-height:1}
.tally span{font-size:13px;color:var(--night-muted);min-width:5.5em;text-align:left}
.lead{color:var(--night-muted);margin:22px 0 0;max-width:36em;font-size:14px}

.chart{margin-top:44px}
.years{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(10px,3vw,36px);align-items:end;height:230px;border-bottom:2px solid var(--night-muted)}
.ycol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.ytot{font-family:var(--num);font-style:italic;font-weight:600;font-size:30px;line-height:1;margin-bottom:8px}
.ytot small{font-family:var(--gothic);font-style:normal;font-weight:400;font-size:11px;color:var(--night-muted);margin-left:3px}
.stack{display:flex;flex-direction:column-reverse;gap:1px;height:var(--h)}
.seg{flex:var(--n) 1 0;min-height:0;border:0;padding:0;background:var(--c);cursor:pointer;transition:opacity .2s}
.seg:hover{filter:brightness(1.12)}
.years.dim .seg{opacity:.2}
.years.dim .seg.on{opacity:1}
.ylab{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(10px,3vw,36px);padding-top:8px}
.ylab span{font-family:var(--num);font-style:italic;font-size:18px;color:var(--night-muted)}
.ylab span.on{color:var(--night-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;padding:22px 0 30px}
.legend button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--night-ink);cursor:pointer;padding:4px 0;font-size:14px}
.legend .sw{width:14px;height:14px;background:var(--c)}
.legend em{font-family:var(--num);font-size:17px;color:var(--night-muted)}
.legend button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:5px}

/* ===== toolbar ===== */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 0 12px;box-shadow:0 8px 20px -18px rgba(0,0,0,.35)}
.search{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding:0 4px;height:52px}
.search svg{flex:none;width:22px;height:22px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--mincho);font-size:22px;color:var(--ink);height:100%;outline:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input::placeholder{color:var(--muted);opacity:.8}
.search .clear{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--muted);display:none}
.search.has .clear{display:block}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px}
.filters{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%;min-width:0}
@media (max-width:600px){.filters .chip .n{display:none}.filters .chip{padding:4px 10px 4px 6px;gap:5px}}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip .n{font-family:var(--num);font-style:italic;font-size:15px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.opts{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap}
.opts select{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.toggle{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:13px}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result{font-size:13px;color:var(--muted);white-space:nowrap}
.result b{font-family:var(--num);font-style:italic;font-size:19px;color:var(--ink)}

/* ===== list ===== */
main{padding:8px 0 80px}
section.genre{margin-top:64px}
.ghead{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:6px 20px;padding-bottom:14px;border-bottom:3px solid var(--c);margin-bottom:6px}
.ghead h2{margin:0;font-family:var(--mincho);font-weight:800;font-size:clamp(30px,4.2vw,44px);line-height:1.1}
.ghead .en{font-family:var(--num);font-style:italic;font-size:24px;color:var(--c);line-height:1.2}
.ghead .n{font-family:var(--num);font-style:italic;font-weight:600;font-size:clamp(44px,6vw,64px);line-height:.8;color:var(--c)}
.ghead p{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
ul.books{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
li.book{display:grid;grid-template-columns:4px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
li.book .spine{align-self:stretch;background:var(--c)}
.bt{font-family:var(--mincho);font-weight:500;font-size:16.5px;line-height:1.5;margin:0;overflow-wrap:anywhere}
.bm{margin:3px 0 0;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.au{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.au:hover{color:var(--ink)}
.tag{font-size:12px;color:var(--accent);letter-spacing:.02em}
.tag::before{content:"#";margin-right:1px;opacity:.55}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.yr{font-family:var(--num);font-style:italic;font-size:16px;color:var(--muted);white-space:nowrap}
.rt{font-size:11px;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.best{display:inline-block;font-family:var(--num);font-style:italic;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 9px;line-height:1.5}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:2px}
.empty{padding:80px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:14px;border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 18px;cursor:pointer}
.viewsw{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;flex:none}
.viewsw button{border:0;background:transparent;padding:5px 14px 5px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.viewsw button svg{width:15px;height:15px;flex:none;opacity:.85}
.viewsw button[aria-pressed="true"] svg{opacity:1}
.viewsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.authors{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:20px}
.acard{border:1px solid var(--line);background:var(--card);padding:16px 16px 14px;text-align:left;cursor:pointer;display:grid;gap:12px;border-radius:2px;color:var(--ink)}
.acard:hover{border-color:var(--ink)}
.acard.au,.singles .au{text-decoration:none;color:var(--ink)}
.acard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.acard .nm{font-family:var(--mincho);font-weight:700;font-size:19px;line-height:1.3}
.acard .ct{font-family:var(--num);font-style:italic;font-weight:600;font-size:42px;line-height:.8;color:var(--c,var(--accent));white-space:nowrap}
.acard .ct small{font-family:var(--gothic);font-style:normal;font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.spines{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;min-height:30px;border-bottom:3px solid var(--line)}
.spines i{width:7px;height:22px;background:var(--c)}
.spines i.tall{height:30px}
.ameta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.singles{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));column-gap:28px}
.singles li{border-bottom:1px solid var(--line)}
.singles button{border:0;background:none;width:100%;text-align:left;padding:9px 0;cursor:pointer;display:grid;grid-template-columns:4px 1fr;gap:10px;color:var(--ink)}
.singles .sp{background:var(--c);align-self:stretch}
.singles b{font-family:var(--mincho);font-weight:700;font-size:15px;display:block}
.singles span.bk{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:28px}
.subchips{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 6px}
.subchip{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.subchip .n{font-family:var(--num);font-style:italic;font-size:14px;color:var(--muted)}
.subchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.subchip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.tag.away{border-color:var(--accent);color:var(--accent)}
.subnote{margin:2px 0 4px;font-size:12.5px;color:var(--muted)}
.gic{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--on-c);flex:none}
.gic svg{width:58%;height:58%}
.gic.od{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gic.od{color:var(--on-c)}}
:root[data-theme="dark"] .gic.od{color:var(--on-c)}
.gic.sm{width:20px;height:20px}
.gic.lg{width:clamp(40px,5vw,52px);height:clamp(40px,5vw,52px);margin-right:14px}
.ghead h2{display:flex;align-items:center}
.kicker::before{content:"✦ ";color:var(--accent);font-style:normal;font-size:.7em;vertical-align:.2em}
.authors.compact{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.authors.compact .acard{padding:12px 12px 10px;gap:8px}
.authors.compact .nm{font-size:15.5px}
.authors.compact .ct{font-size:30px}
.authors.compact .spines{min-height:20px;border-bottom-width:2px}
.authors.compact .spines i{width:6px;height:15px}
.authors.compact .spines i.tall{height:20px}
.authors.compact .ameta{font-size:11px;gap:6px}
@media (max-width:600px){.authors.compact{grid-template-columns:1fr 1fr}}
.backbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;padding:12px 14px;background:var(--night);border-radius:4px}
.backbar button{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer}
.backbar span{font-family:var(--mincho);font-weight:700;color:var(--night-ink)}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:12.5px;color:var(--muted)}

@media (max-width:860px){
  ul.books{grid-template-columns:1fr}
  .hero-top{grid-template-columns:1fr}
  .tally{grid-auto-flow:column;justify-content:start;text-align:left}
  .tally div{justify-content:flex-start}.tally span{min-width:0}
}
@media (max-width:600px){
  .wrap{padding:0 18px}
  .hero{padding-top:40px}
  .tally b{font-size:36px}
  .years{height:170px}
  .ytot{font-size:22px}.ytot small{display:none}
  .ylab span{font-size:14px}
  .legend{gap:4px 16px}.legend button{font-size:13px}
  .search input{font-size:18px}
  .opts{width:100%;flex:1 1 100%}
  .result{margin-left:auto}
  section.genre{margin-top:48px}
  li.book{gap:11px}
  .bt{font-size:15.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div>
        <p class="kicker">2021 – 2026</p>
        <h1><span class="en">Bookshelf</span><span class="ja">読んだ本リスト</span></h1>
        <p class="lead">6年分の読書記録から、読み終えた本を6つの棚に分けました。下のグラフは、年ごとに読んだ冊数とその内訳です。色を押すと、その年のその棚に絞り込めます。</p>
      </div>
      <div class="tally" id="tally"></div>
    </div>
    <div class="chart">
      <div class="years" id="years"></div>
      <div class="ylab" id="ylab"></div>
      <div class="legend" id="legend" role="group" aria-label="棚を選ぶ"></div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <label class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="書名・著者名で探す" autocomplete="off" aria-label="書名・著者名で探す">
      <button class="clear" id="clear" type="button" aria-label="検索語を消す">✕</button>
    </label>
    <div class="controls">
      <div class="filters" id="genres" role="group" aria-label="棚"></div>
      <div class="opts">
        <div class="viewsw" id="viewsw" role="group" aria-label="表示の切り替え"><button type="button" data-v="books"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.5 4h4.2v16H3.5z M9.2 4h4.2v16H9.2z M15 5.2l3.9-1 4 15.4-3.9 1z"/></svg>本</button><button type="button" data-v="authors"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.8a4.1 4.1 0 1 1 0 8.2a4.1 4.1 0 1 1 0-8.2z M4.3 20.2c0-4.1 3.5-6.7 7.7-6.7s7.7 2.6 7.7 6.7z"/></svg>著者</button><button type="button" data-v="tsundoku"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.3 3.5h11.4v17.2L12 16.6l-5.7 4.1z"/></svg>読みかけ</button></div>
        <select id="year" aria-label="読んだ年"></select>
        <select id="sort" aria-label="並び順">
          <option value="new">新しい順</option>
          <option value="rate">評価順</option>
          <option value="title">書名順</option>
        </select>
        <button class="toggle" id="bestOnly" type="button" aria-pressed="false">Best!!</button>
        <span class="result" id="result" aria-live="polite"></span>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <main id="list"></main>
  <footer>Notionの読書キロク（〜2021年〜2026年）の「読了」の本から作成。2026年11月22日時点のデータです。何度か読んだ本は1冊にまとめ、読んだ年を並べています。</footer>
</div>

<script>
const RAW = `#2021
白ゆき姫殺人事件|湊かなえ|q|B|
騎士団長殺しⅠ|村上春樹|n|3|
贖罪|湊かなえ|q|3|
世界一やさしいやりたいコトの見つけ方|八木仁平|b|3|
服を買うなら、捨てなさい|地曳いく子|l|3|
望む人生に組み替える「人生設計ノート」||b|2|
国語、算数、理科、誘拐|青柳碧人|q|3|
人は話し方が9割|永松茂久|b|3|
叫びと祈り|梓崎優|q|3|
おかねに愛される魔法のお財布||l|2|
「ずるい考え方」|木村尚義|b|2|
AとZ||b|B|
オンライン就活||b|2|
赤い指|東野圭吾|q|2|
葉桜の季節に君を想うということ|歌野晶午|q|3|
ルビンの壺が割れた|宿野かほる|q|B|
氷菓|米澤穂信|q|2|
パラレルワールド・ラブストーリー|東野圭吾|q|B|
リバース|湊かなえ|q|B|
スタンフォード式最高の睡眠|西野精治|l|2|
ぼくのメジャースプーン|辻村深月|n|3|
medium|相沢沙呼|q|B|
豆の上で眠る|湊かなえ|q|2|
LOVE理論|水野敬也|b|B|

const map = new Map(); let year = '';

  const key = norm(t), when = (+year)*100 + (m ? +m : 0);
  let b = map.get(key);
  if (!b) { b = {t, a:a||'', g, sub, r:r||'', years:[], when:0}; map.set(key,b); }
  if (!b.a && a) b.a = a;
  if (RANK[r||''] > RANK[b.r]) b.r = r;
  if (!b.years.includes(year)) b.years.push(year);
  b.when = Math.max(b.when, when);

function matches(b){
  if (state.y!=='all' && !b.years.includes(state.y)) return false;
  if (state.best && b.r!=='B') return false;
  if (state.subs.length && !(b.g==='novel' && state.subs.every(t=>b.subs.includes(t)))) return false;
  if (state.q) {
    const terms = state.q.split(/\s+/).map(norm).filter(Boolean);
    const g = GENRES[gIndex(b.g)], gname = norm(g.name+' '+g.en);
    if (!terms.every(t => b.k.includes(t) || gname.includes(t))) return false;
  }
  return true;
}
function hl(text){
  let out = esc(text); const q = state.q.trim(); if (!q) return out;
  for (const term of q.split(/\s+/).filter(Boolean)) {
    const t = esc(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out = out.replace(new RegExp(`(${t})`,'gi'),'<mark>$1</mark>');
  }
  return out;
}

function sorter(a,b){
  if (state.sort==='title') return a.t.localeCompare(b.t,'ja');
  if (state.sort==='rate') return RANK[b.r]-RANK[a.r] || b.when-a.when;
  return b.when-a.when;
}

  }).join('');
}

const authorsOf = b => b.a ? b.a.split('、').map(x=>x.trim()).filter(x=>x && x!=='複数の著者') : [];
function renderAuthors(shown){
  const m = new Map();
  for (const b of shown) for (const a of authorsOf(b)) { if (!m.has(a)) m.set(a, []); m.get(a).push(b); }
  const arr = [...m.entries()].map(([a,bs]) => ({a, bs:bs.sort((x,y)=>x.when-y.when), best:bs.filter(b=>b.r==='B').length}))
    .sort((x,y)=> y.bs.length-x.bs.length || y.best-x.best || x.a.localeCompare(y.a,'ja'));
  const noAuthor = shown.filter(b=>!b.a).length;
  $('result').innerHTML = `<b>${arr.length}</b> 人`;
  const yrs = bs => { const ys=[...new Set(bs.flatMap(b=>b.years))].sort(); const f=y=>y==='2021'?'〜2021':y; return ys.length>1 ? `${f(ys[0])}–${f(ys[ys.length-1])}` : f(ys[0]); };
  const top = g => { const c={}; for (const b of g.bs) c[b.g]=(c[b.g]||0)+1; return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]; };
  const card = x => `<button class="acard au" type="button" data-a="${esc(x.a)}" style="--c:var(--g-${top(x)})">
      <div class="top"><span class="nm">${hl(x.a)}</span><span class="ct">${x.bs.length}<small>冊</small></span></div>
      <div class="spines">${x.bs.map(b=>`<i class="${b.r==='B'?'tall':''}" style="--c:var(--g-${b.g})" title="${esc(b.t)}"></i>`).join('')}</div>
      <div class="ameta"><span>${yrs(x.bs)}</span>${x.best?`<span>Best!! ${x.best}冊</span>`:''}</div></button>`;
  const tiers = [
    {name:'よく読む作家', en:'Favorites', desc:'5冊以上読んだ作家。', list:arr.filter(x=>x.bs.length>=5), c:'var(--accent)'},
    {name:'何冊か読んだ作家', en:'Regulars', desc:'2〜4冊読んだ作家。', list:arr.filter(x=>x.bs.length>=2&&x.bs.length<5), c:'var(--g-words)'},
    {name:'1冊読んだ作家', en:'First meetings', desc:'まだ1冊だけの作家。次の1冊を探すならここから。', list:arr.filter(x=>x.bs.length===1), c:'var(--g-life)'}
  ];
  $('list').innerHTML = tiers.filter(t=>t.list.length).map((t,i)=>`<section class="genre" style="--c:${t.c}">
    <div class="ghead"><h2>${t.name}</h2><span class="en">${t.en}</span><span class="n">${t.list.length}</span><p>${t.desc}</p></div>
    ${i<2 ? `<div class="authors${i===1?' compact':''}">${t.list.map(card).join('')}</div>`
      : `<ul class="singles">${t.list.map(x=>`<li><button class="au" type="button" data-a="${esc(x.a)}"><span class="sp" style="--c:var(--g-${x.bs[0].g})"></span><span><b>${hl(x.a)}</b><span class="bk">${esc(x.bs[0].t)}</span></span></button></li>`).join('')}</ul>`}
  </section>`).join('') + (noAuthor ? `<p class="note">著者名がまだ分からない本が${noAuthor}冊あり、この一覧には入っていません。共著の本は、それぞれの著者に1冊ずつ数えています。</p>` : '');
}
function renderTsundoku(){
  const terms = state.q.split(/\s+/).map(norm).filter(Boolean);
  const list = SHELF.filter(b => (state.g==='all'||b.g===state.g) && (!state.home||!b.away) && terms.every(t=>b.k.includes(t)));
  const awayN = SHELF.filter(b=>b.away).length;
  const toggle = `<div class="subchips" role="group" aria-label="手元にあるか"><button type="button" class="subchip hm" data-h="" aria-pressed="${!state.home}">すべて</button><button type="button" class="subchip hm" data-h="1" aria-pressed="${state.home}">手元にある本だけ</button></div><p class="subnote">手元にない本には印をつけています（今は${awayN}冊）。</p>`;
  $('result').innerHTML = `<b>${list.length}</b> 冊`;
  const groups = [
    {home:true, name:'手元にある本', en:'At home', desc:'読みかけの本のうち、いま家にある本。続きを読むならここから。', c:'var(--accent)'},
    {home:false, name:'手元にない本', en:'Somewhere else', desc:'読みかけの本のうち、いまは手元にない本。', c:'var(--g-learn)'}
  ];
  const html = groups.map(gr=>{
    const items = list.filter(b=>!b.away===gr.home); if (!items.length) return '';
    return `<section class="genre" style="--c:${gr.c}"><div class="ghead"><h2>${gr.name}</h2><span class="en">${gr.en}</span><span class="n">${items.length}</span><p>${gr.desc}</p></div>
      <ul class="books">${items.map(b=>`<li class="book" style="--c:var(--g-${b.g})"><span class="spine"></span>
        <div><p class="bt">${hl(b.t)}</p><p class="bm">${b.a?`<button class="au" type="button" data-a="${esc(b.a)}">${hl(b.a)}</button>`:''}${b.subs.map(x=>`<span class="tag">${hl(x)}</span>`).join('')}</p></div>
        <div class="side">${gicon(b.g,'gic sm')}</div></li>`).join('')}</ul></section>`;
  }).join('');
  $('list').innerHTML = (html || `<div class="empty"><p>当てはまる本はありません。</p></div>`);
}
function setView(v){
  state.view = v;
  try { history.replaceState(null, '', v==='books' ? location.pathname + location.search : '#'+v); }
  catch (e) { try { if (v!=='books') location.hash = v; else if (location.hash) location.hash = ''; } catch (_) {} }
  render();
}
$('viewsw').addEventListener('click', e => { const b=e.target.closest('button'); if (b) setView(b.dataset.v); });
addEventListener('hashchange', () => { state.view = ['#authors','#tsundoku'].includes(location.hash) ? location.hash.slice(1) : 'books'; render(); });
$('q').addEventListener('input', e => { state.q = e.target.value; $('searchBox').classList.toggle('has', !!state.q); render(); });
$('clear').addEventListener('click', () => { $('q').value=''; state.q=''; $('searchBox').classList.remove('has'); render(); $('q').focus(); });
$('genres').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; state.g = c.dataset.g; if (state.g!=='novel') state.subs=[]; render(); });
$('year').addEventListener('change', e => { state.y = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('bestOnly').addEventListener('click', e => { state.best = !state.best; e.currentTarget.setAttribute('aria-pressed', state.best); render(); });
$('list').addEventListener('click', e => {
  const hm = e.target.closest('.hm');
  if (hm) { state.home = !!hm.dataset.h; render(); return; }
  const sc = e.target.closest('.subchip');
  if (sc) { const t = sc.dataset.s; if (!t) state.subs = []; else { state.subs = state.subs.includes(t) ? state.subs.filter(x=>x!==t) : [...state.subs, t]; state.g = 'novel'; } render(); return; }
  if (e.target.closest('#backBtn')) { const bk = state.back; state.back = null; $('q').value=''; state.q=''; $('searchBox').classList.remove('has'); setView(bk.view); requestAnimationFrame(()=>scrollTo(0, bk.y)); return; }
  const a = e.target.closest('.au'); if (!a) return;
  state.back = state.view!=='books' ? {view:state.view, y:scrollY, a:a.dataset.a} : null;
  $('q').value = a.dataset.a; state.q = a.dataset.a; $('searchBox').classList.add('has'); state.g='all'; setView('books');
  document.querySelector('.bar').scrollIntoView();
});
render();
</script>
</body>
</html>
